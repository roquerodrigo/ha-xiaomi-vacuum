clean_zone:
  target:
    entity:
      integration: xiaomi_vacuum
      domain: vacuum
  fields:
    zones:
      required: true
      example: "[[260, 250, 890, 750]]"
      selector:
        object:
    repeats:
      selector:
        number:
          min: 1
          max: 3
          mode: box

start_custom_cleaning:
  target:
    entity:
      integration: xiaomi_vacuum
      domain: vacuum
  fields:
    name:
      required: true
      example: "Afternoon cleaning"
      selector:
        select:
          options: []
          custom_value: true

refresh_fault_history:
  name: Refresh fault history
  description: >-
    Read the most recent Xiaomi cloud Device Fault messages without marking
    notifications as read. Results appear in the cloud_fault_history attribute
    of the vacuum's error code sensor. Requires an active Xiaomi cloud session.
  target:
    entity:
      integration: xiaomi_vacuum
      domain: vacuum
